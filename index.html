<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Fracture — a poem, remastered as a living film." />
    <title>Fracture</title>
    <link rel="preload" href="./media/lake.jpg" as="image" />
  </head>
  <body>
    <canvas id="gl" aria-hidden="true"></canvas>

    <div id="stage" aria-live="polite">
      <div id="title" aria-hidden="true">
        <div class="title-inner">
          <span class="half top">Fracture</span>
          <span class="half bot">Fracture</span>
        </div>
      </div>
      <div id="lyrics"></div>
      <div id="heroes"></div>
    </div>

    <section id="intro" class="overlay">
      <h1 class="intro-title">Fracture</h1>
      <p class="intro-date">October 11, 2025</p>
      <button id="begin" class="btn" disabled>
        <span class="btn-label">Loading</span>
      </button>
      <p class="intro-hint">Sound on &middot; headphones recommended &middot; <button id="check" class="link" type="button">check left / right</button></p>
      <div class="loadbar"><i id="loadfill"></i></div>
      <button id="fs-intro" class="ctl intro-fs" type="button" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </section>

    <section id="outro" class="overlay hidden">
      <h2 class="intro-title small">Fracture</h2>
      <button id="replay" class="btn"><span class="btn-label">Watch again</span></button>
    </section>

    <nav id="controls" class="hidden" aria-label="Playback">
      <button id="play" class="ctl" aria-label="Pause">
        <svg viewBox="0 0 24 24" class="i-pause"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      </button>
      <span id="time" class="time">0:00</span>
      <input id="scrub" type="range" min="0" max="242" step="0.01" value="0" aria-label="Seek" />
      <span id="dur" class="time">4:02</span>
      <button id="fs" class="ctl" aria-label="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
